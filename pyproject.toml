[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "azure-ai-foundry-metrics"
version = "0.1.0"
description = "Command-line dashboard for tracking Azure AI Foundry credits, tokens (cached vs uncached), and costs per model"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "azure-identity>=1.16.0",
    "azure-mgmt-cognitiveservices>=13.5.0",
    "azure-mgmt-resource>=23.0.0",
    "azure-mgmt-costmanagement>=4.0.0",
    "azure-mgmt-monitor>=6.0.0",
    "requests>=2.31.0",
    "rich>=13.7.0",
    "click>=8.1.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
azure-ai-metrics = "foundry_metrics.cli:main"
foundry-metrics = "foundry_metrics.cli:main"
